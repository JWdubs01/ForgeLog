f(sw!==tw||sd!==td||sid===tid)return;let arr=cells(b,{id:sw},{id:sd}),source=arr.find(x=>x.id===sid),target=arr.find(x=>x.id===tid);if(!source||!target||(source.cluster||source.lift)!==(target.cluster||target.lift))return alert('Prescriptions can only be reordered inside the same cluster. Change the category to move it to another cluster.');let from=arr.indexOf(source),to=arr.indexOf(target);arr.splice(from,1);if(from<to)to--;arr.splice(to,0,source);queue();go('plan')})})}};
const Plan={blank(ex,group){return{id:uid(),exercise:ex,lift:group,cluster:group,sets:'',reps:'',prescribedWeight:'',prescribedRpe:'',actualLoad:'',actualRpe:'',notes:''}},addExercise(w,d){modal('Add exercise to workout',`<form id="addExerciseForm" class="form"><div class="field"><label>Exercise</label><select name="exercise">${exopts('')}</select></div><div class="field"><label>Cluster / category</label><select name="group">${GROUPS.map(g=>`<option>${g}</option>`).join('')}</select></div><div class="span"><button class="btn">Add exercise</button></div></form>`);let form=E('addExerciseForm'),exercise=form.elements.exercise,group=form.elements.group;group.value=exgroup(exercise.value,'Chest');exercise.onchange=()=>group.value=exgroup(exercise.value,group.value);form.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(form)),z=Plan.blank(v.exercise,v.group);cells(block(),{id:w},{id:d}).push(z);await save('Exercise added to workout');closeM();go('plan');toast(v.exercise+' added')}},addToCluster(w,d,g){let choices=S.exerciseLibrary.filter(x=>x.group===g),first=choices[0]||S.exerciseLibrary[0];modal('Add to '+g+' cluster',`<form id="addClusterForm" class="form"><div class="field"><label>Exercise</label><select name="exercise">${choices.length?choices.map(x=>`<option>${esc(x.name)}</option>`).join(''):exopts('')}</select></div><div class="span"><button class="btn">Add to ${g} cluster</button></div></form>`);E('addClusterForm').onsubmit=async e=>{e.preventDefault();let name=new FormData(e.target).get('exercise')||first.name,z=Plan.blank(name,g);cells(block(),{id:w},{id:d}).push(z);await save('Prescription added to '+g+' cluster');closeM();go('plan');toast('Added to '+g+' cluster')}},del(w,d,id){let b=block();b.cells[w+'|'+d]=cells(b,{id:w},{id:d}).filter(x=>x.id!==id);queue();go('plan')}};
